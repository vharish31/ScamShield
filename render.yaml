services:
  - type: web
    name: scamshield-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: ML_MODEL_ENABLED
        value: "true"
      - key: NOTIFICATION_ENABLED
        value: "false"
      - key: MAX_AUDIO_SIZE_MB
        value: "25"
      - key: WHISPER_MODEL_SIZE
        value: "base"

